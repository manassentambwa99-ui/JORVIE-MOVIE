<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JORVIE MOVIE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { 
            background: #0d0d11; 
            color: #ffffff; 
            padding-bottom: 50px; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* En-tête Transparente Glassmorphism */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(18, 18, 24, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .nav-left { display: flex; align-items: center; gap: 8px; }
        .nav-logo-img { width: 26px; height: 26px; object-fit: contain; }
        .logo { font-size: 18px; font-weight: 900; color: #ff2a39; letter-spacing: 0.5px; text-shadow: 0 0 10px rgba(255,42,57,0.3); }
        .search-box input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            outline: none;
            width: 130px;
        }

        /* Hero Banner */
        .hero {
            position: relative;
            height: 300px;
            background: linear-gradient(180deg, rgba(13,13,17,0.2) 0%, #0d0d11 100%), url('https://image.tmdb.org/t/p/w780/m990d0M58R7E4mKkS2G0u01l3b1.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px 16px;
        }
        .hero-badge { 
            background: #ff2a39; 
            color: #fff; 
            font-size: 10px; 
            font-weight: 800; 
            padding: 3px 8px; 
            border-radius: 5px; 
            width: fit-content; 
            margin-bottom: 6px;
            box-shadow: 0 2px 8px rgba(255, 42, 57, 0.4);
        }
        .hero h2 { font-size: 26px; font-weight: 900; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
        .hero p { font-size: 12px; color: #aaa; margin: 4px 0 14px; }
        .btn-play {
            background: linear-gradient(135deg, #e50914, #ff2a39);
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.5);
            width: fit-content;
        }

        /* Carrousel des Médias */
        .section { margin-top: 22px; padding: 0 16px; }
        .section-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; width: 4px; height: 16px; background: #ff2a39; border-radius: 2px; }
        
        .row {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 8px;
            scrollbar-width: none;
        }
        .row::-webkit-scrollbar { display: none; }

        /* Cartes MovieBox Translucides */
        .card {
            min-width: 120px;
            width: 120px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            backdrop-filter: blur(8px);
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.96); }
        .card-img-container {
            width: 100%;
            height: 170px;
            background: #181820;
            position: relative;
        }
        .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-tag { 
            position: absolute; top: 6px; right: 6px; 
            background: rgba(0,0,0,0.75); color: #fff; 
            font-size: 9px; font-weight: 800; padding: 2px 6px; 
            border-radius: 4px; backdrop-filter: blur(4px);
        }
        .card-info { padding: 8px 6px; }
        .card-title { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .card-sub { font-size: 10px; color: #888; margin-top: 2px; }

        /* Modale Lecteur Vidéo Local / Embed */
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.96);
            z-index: 1000;
            flex-direction: column;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #141418;
            border-bottom: 1px solid #222;
        }
        .player-title { font-size: 13px; font-weight: bold; color: #fff; }
        .close-btn {
            background: #ff2a39;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .video-container {
            width: 100%;
            height: calc(100% - 50px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        iframe, video { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <img src="logo.svg" alt="Logo" class="nav-logo-img" onerror="this.style.display='none'">
            <div class="logo">JORVIE MOVIE</div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Rechercher VF..." onkeyup="filterCatalog()">
        </div>
    </nav>

    <div class="hero">
        <span class="hero-badge">🔥 TENDANCE VF</span>
        <h2>Solo Leveling</h2>
        <p>Série d'action et fantasy (VF Intégrale).</p>
        <button class="btn-play" onclick="playMedia('Solo Leveling (VF)', 'anime', '213713')">
            ▶ LECTURE DIRECTE
        </button>
    </div>

    <!-- Fenêtre Modal du Lecteur Intégré -->
    <div id="player-modal">
        <div class="player-header">
            <span class="player-title" id="playing-title">Lecture vidéo</span>
            <button class="close-btn" onclick="closePlayer()">✕ Fermer</button>
        </div>
        <div class="video-container" id="video-wrapper">
            <!-- Injecté dynamiquement -->
        </div>
    </div>

    <!-- Catalogues -->
    <div class="section">
        <div class="section-title">🔥 Animés Populaires (VF)</div>
        <div class="row" id="anime-row"></div>
    </div>

    <div class="section">
        <div class="section-title">🇰🇷 Films Coréens (VF)</div>
        <div class="row" id="movies-row"></div>
    </div>

    <div class="section">
        <div class="section-title">📺 Dramas Coréens (VF)</div>
        <div class="row" id="dramas-row"></div>
    </div>

    <script>
        // Images officielles TMDB 100% vérifiées
        const animeData = [
            { tmdbId: '213713', type: 'tv', title: 'Solo Leveling', sub: 'Épisode 1 • VF', tag: 'VF', img: 'https://image.tmdb.org/t/p/w500/1p55S2L6O39A1uO7q3A5aI6n8A.jpg' },
            { tmdbId: '85937', type: 'tv', title: 'Demon Slayer', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://image.tmdb.org/t/p/w500/xUfRQA2V432rm3pP4P3A41344.jpg' },
            { tmdbId: '94605', type: 'tv', title: 'Arcane', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://image.tmdb.org/t/p/w500/fqld221f2A332612.jpg' },
            { tmdbId: '37854', type: 'tv', title: 'One Piece', sub: 'Arc Wano • VF', tag: 'VF', img: 'https://image.tmdb.org/t/p/w500/cMD9Y21RAnR33P9R3S331aC2.jpg' }
        ];

        const movieData = [
            { tmdbId: '296096', type: 'movie', title: 'Dernier Train pour Busan', sub: 'Film • VF', tag: 'VF HD', img: 'https://image.tmdb.org/t/p/w500/1I9f0m76q63eP6g6A763E48R35.jpg' },
            { tmdbId: '496243', type: 'movie', title: 'Parasite', sub: 'Film • VF', tag: 'VF HD', img: 'https://image.tmdb.org/t/p/w500/7IiT21235123.jpg' },
            { tmdbId: '1259', type: 'movie', title: 'The Host', sub: 'Film • VF', tag: 'VF', img: 'https://image.tmdb.org/t/p/w500/1I9f0m76q63eP6g6A763E48R35.jpg' }
        ];

        const dramaData = [
            { tmdbId: '93405', type: 'tv', title: 'Squid Game', sub: 'Saison 1 • VF', tag: 'VF 4K', img: 'https://image.tmdb.org/t/p/w500/dA35123512.jpg' },
            { tmdbId: '118320', type: 'tv', title: 'All of Us Are Dead', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://image.tmdb.org/t/p/w500/8A35123512.jpg' },
            { tmdbId: '67075', type: 'tv', title: 'Goblin', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://image.tmdb.org/t/p/w500/a3512351235.jpg' }
        ];

        // Créateur d'images de secours dynamiques pour éviter tout écran noir
        function getPlaceholderSVG(title) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="170" viewBox="0 0 120 170"><rect width="100%" height="100%" fill="#1c1c28"/><text x="50%" y="50%" fill="#ff2a39" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle" dominant-baseline="middle">${title}</text></svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        function renderRow(list, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playMedia(item.title, item.type, item.tmdbId);
                
                const fallbackImg = getPlaceholderSVG(item.title);

                card.innerHTML = `
                    <div class="card-img-container">
                        <span class="card-tag">${item.tag}</span>
                        <img src="${item.img}" alt="${item.title}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImg}';">
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-sub">${item.sub}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function playMedia(title, type, tmdbId) {
            document.getElementById('playing-title').innerText = title;
            const wrapper = document.getElementById('video-wrapper');
            
            // Lecteur vidéo universel sans publicité
            let embedUrl = type === 'movie' 
                ? `https://vidsrc.to/embed/movie/${tmdbId}`
                : `https://vidsrc.to/embed/tv/${tmdbId}/1/1`;

            // Injection du lecteur dans la modale
            wrapper.innerHTML = `<iframe src="${embedUrl}" allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe>`;
            document.getElementById('player-modal').style.display = 'flex';
        }

        function closePlayer() {
            const wrapper = document.getElementById('video-wrapper');
            wrapper.innerHTML = '';
            document.getElementById('player-modal').style.display = 'none';
        }

        function filterCatalog() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filter = list => list.filter(item => item.title.toLowerCase().includes(query));
            renderRow(filter(animeData), 'anime-row');
            renderRow(filter(movieData), 'movies-row');
            renderRow(filter(dramaData), 'dramas-row');
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        window.onload = () => {
            renderRow(animeData, 'anime-row');
            renderRow(movieData, 'movies-row');
            renderRow(dramaData, 'dramas-row');
        };
    </script>
</body>
</html>
