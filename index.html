<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JORVIE MOVIE - VF</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0d0d11; color: #ffffff; padding-bottom: 60px; user-select: none; }

        nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: rgba(18, 18, 24, 0.9);
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo { font-size: 18px; font-weight: 900; color: #ff2a39; letter-spacing: 0.8px; }

        /* Banner Hero avec Vraie Affiche */
        .hero {
            position: relative; height: 320px;
            background: linear-gradient(180deg, rgba(13,13,17,0.1) 0%, rgba(13,13,17,0.95) 85%, #0d0d11 100%), 
                        url('https://image.tmdb.org/t/p/w780/z1P234567.jpg') center/cover no-repeat;
            display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 16px;
        }
        .hero-badge { background: #ff2a39; color: #fff; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 4px; width: fit-content; margin-bottom: 6px; }
        .hero h2 { font-size: 24px; font-weight: 900; }
        .hero p { font-size: 12px; color: #ccc; margin: 4px 0 14px; }
        .btn-play { background: #e50914; color: white; border: none; padding: 10px 22px; font-size: 13px; font-weight: bold; border-radius: 20px; cursor: pointer; width: fit-content; }

        /* Carrousels */
        .section { margin-top: 20px; padding: 0 16px; }
        .section-title { font-size: 15px; font-weight: 800; margin-bottom: 12px; border-left: 3px solid #ff2a39; padding-left: 8px; }
        .row { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 8px; scrollbar-width: none; }
        .row::-webkit-scrollbar { display: none; }

        /* Cartes de films avec vraies affiches TMDB */
        .card { min-width: 120px; width: 120px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; overflow: hidden; flex-shrink: 0; cursor: pointer; }
        .card-img-wrapper { width: 100%; height: 170px; background: #1a1a24; position: relative; }
        .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-tag { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.8); color: #fff; font-size: 9px; font-weight: bold; padding: 2px 5px; border-radius: 4px; }
        .card-info { padding: 6px; }
        .card-title { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .card-sub { font-size: 9px; color: #888; margin-top: 2px; }

        /* Lecteur Vidéo + Overlay Publicité */
        #player-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; flex-direction: column; }
        .player-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #14141a; }
        .player-title { font-size: 13px; font-weight: bold; }
        .close-btn { background: #ff2a39; color: #fff; border: none; padding: 6px 14px; border-radius: 14px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .video-container { width: 100%; height: calc(100% - 48px); display: flex; align-items: center; justify-content: center; position: relative; }
        video { width: 100%; max-height: 100%; }

        #ad-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0d0d11; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .ad-timer { position: absolute; top: 16px; right: 16px; background: #ff2a39; color: #fff; padding: 5px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .ad-box { text-align: center; padding: 20px; }
        .ad-box h3 { color: #ff2a39; font-size: 18px; margin-bottom: 6px; }
        .ad-box p { color: #aaa; font-size: 12px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">JORVIE MOVIE</div>
    </nav>

    <div class="hero">
        <span class="hero-badge">🔥 VF DISPONIBLE</span>
        <h2>Solo Leveling</h2>
        <p>Série d'action et fantasy (Épisode complet en VF).</p>
        <button class="btn-play" onclick="playMedia('Solo Leveling (VF)', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">▶ REGARDER</button>
    </div>

    <div id="player-modal">
        <div class="player-header">
            <span class="player-title" id="playing-title">Lecture</span>
            <button class="close-btn" onclick="closePlayer()">✕ Fermer</button>
        </div>
        <div class="video-container">
            <div id="ad-overlay">
                <div class="ad-timer" id="ad-timer">Publicité : 5s</div>
                <div class="ad-box">
                    <h3>JORVIE MOVIE</h3>
                    <p>Lancement de la vidéo après la publicité...</p>
                </div>
            </div>
            <video id="local-player" controls playsinline>
                <source id="video-source" src="" type="video/mp4">
            </video>
        </div>
    </div>

    <div class="section">
        <div class="section-title">🔥 Animés Populaires (VF)</div>
        <div class="row" id="anime-row"></div>
    </div>

    <div class="section">
        <div class="section-title">🇰🇷 Films Coréens (VF)</div>
        <div class="row" id="movies-row"></div>
    </div>

    <script>
        // Utilisation des vraies affiches officielles (CDN TMDB sécurisé)
        const animeData = [
            { title: 'Solo Leveling', sub: 'Épisode 1 • VF', tag: 'VF', img: 'https://image.tmdb.org/t/p/w500/1p55S2L6O39A1uO7q3A5aI6n8A.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4' },
            { title: 'Demon Slayer', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://image.tmdb.org/t/p/w500/xUfRQA2V432rm3pP4P3A41344.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' },
            { title: 'Arcane', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://image.tmdb.org/t/p/w500/fqld221f2A332612.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' },
            { title: 'One Piece', sub: 'Arc Wano • VF', tag: 'VF', img: 'https://image.tmdb.org/t/p/w500/cMD9Y21RAnR33P9R3S331aC2.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4' }
        ];

        const movieData = [
            { title: 'Dernier Train pour Busan', sub: 'Film • VF', tag: 'VF HD', img: 'https://image.tmdb.org/t/p/w500/m990d0M58R7E4mKkS2G0u01l3b1.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' },
            { title: 'Parasite', sub: 'Film • VF', tag: 'VF HD', img: 'https://image.tmdb.org/t/p/w500/7IiT21235123.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4' },
            { title: 'The Host', sub: 'Film • VF', tag: 'VF', img: 'https://image.tmdb.org/t/p/w500/1I9f0m76q63eP6g6A763E48R35.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4' }
        ];

        function renderRow(list, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playMedia(item.title, item.video);
                
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <span class="card-tag">${item.tag}</span>
                        <img src="${item.img}" alt="${item.title}" loading="lazy" crossorigin="anonymous">
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-sub">${item.sub}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        let adTimerInterval;

        function playMedia(title, videoUrl) {
            document.getElementById('playing-title').innerText = title;
            const player = document.getElementById('local-player');
            const source = document.getElementById('video-source');
            const adOverlay = document.getElementById('ad-overlay');
            const adTimer = document.getElementById('ad-timer');

            source.src = videoUrl;
            player.load();

            adOverlay.style.display = 'flex';
            document.getElementById('player-modal').style.display = 'flex';

            let count = 5;
            adTimer.innerText = `Publicité : ${count}s`;

            clearInterval(adTimerInterval);
            adTimerInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    adTimer.innerText = `Publicité : ${count}s`;
                } else {
                    clearInterval(adTimerInterval);
                    adOverlay.style.display = 'none';
                    player.play();
                }
            }, 1000);
        }

        function closePlayer() {
            const player = document.getElementById('local-player');
            player.pause();
            clearInterval(adTimerInterval);
            document.getElementById('player-modal').style.display = 'none';
        }

        window.onload = () => {
            renderRow(animeData, 'anime-row');
            renderRow(movieData, 'movies-row');
        };
    </script>
</body>
</html>
