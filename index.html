<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JORVIE MOVIE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e50914">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: #141414; color: #fff; padding-bottom: 50px; }

        /* Navigation Style MovieBox / Netflix */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(0,0,0,0.9);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 22px; font-weight: 900; color: #e50914; letter-spacing: 1.5px; }
        .search-box input {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            outline: none;
            width: 140px;
        }

        /* Hero Banner */
        .hero {
            height: 300px;
            background: linear-gradient(0deg, #141414 0%, rgba(0,0,0,0.4) 100%), url('https://images.justwatch.com/backdrop/310938637/s1440/solo-leveling.webp') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }
        .hero h2 { font-size: 26px; font-weight: 800; }
        .hero p { font-size: 12px; color: #ccc; margin: 6px 0 12px; }
        .hero .btn-play {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 10px 22px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: fit-content;
        }

        /* Sections & Grilles */
        .section { margin-top: 22px; padding: 0 15px; }
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; border-left: 4px solid #e50914; padding-left: 8px; }
        
        .row {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .row::-webkit-scrollbar { display: none; }

        .card {
            min-width: 120px;
            width: 120px;
            background: #222;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
        }
        .card img { width: 100%; height: 165px; object-fit: cover; }
        .card-title { font-size: 11px; padding: 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Lecteur Vidéo Interne (Sans iframe externe) */
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #111;
        }
        .player-title { font-size: 14px; font-weight: bold; color: #fff; }
        .close-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        video {
            width: 100%;
            height: calc(100% - 50px);
            background: #000;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">JORVIE MOVIE</div>
        <div class="search-box">
            <input type="text" placeholder="Rechercher...">
        </div>
    </nav>

    <!-- Bannière Principal -->
    <div class="hero">
        <h2>Solo Leveling</h2>
        <p>Série d'action et de fantasy très populaire.</p>
        <button class="btn-play" onclick="playVideo('Solo Leveling', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">▶ REGARDER</button>
    </div>

    <!-- Modale Lecteur Intégré (Zéro pub / Zéro redirection) -->
    <div id="player-modal">
        <div class="player-header">
            <span class="player-title" id="playing-title">Lecture</span>
            <button class="close-btn" onclick="closePlayer()">✕ Fermer</button>
        </div>
        <video id="native-player" controls autoplay playsinline></video>
    </div>

    <!-- Contenus -->
    <div class="section">
        <div class="section-title">🔥 Animés Populaires</div>
        <div class="row" id="anime-row"></div>
    </div>

    <div class="section">
        <div class="section-title">🇰🇷 Films Coréens (VF)</div>
        <div class="row" id="movies-row"></div>
    </div>

    <div class="section">
        <div class="section-title">📺 Dramas Coréens</div>
        <div class="row" id="dramas-row"></div>
    </div>

    <script>
        // Catalogues de démonstration stables avec vidéos intégrées
        const animelist = [
            { title: "Sousou no Frieren", img: "https://cdn.myanimelist.net/images/anime/1015/138025.jpg", src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" },
            { title: "Re:Zero", img: "https://cdn.myanimelist.net/images/anime/11/79410.jpg", src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
            { title: "Fullmetal Alchemist", img: "https://cdn.myanimelist.net/images/anime/1221/91661.jpg", src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" },
            { title: "Demon Slayer", img: "https://cdn.myanimelist.net/images/anime/1286/99889.jpg", src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" }
        ];

        const movieslist = [
            { title: "Dernier Train pour Busan", img: "https://image.tmdb.org/t/p/w300/1p55S2L6O39A1uO7q3A5aI6n8A.jpg", src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" },
            { title: "Parasite", img: "https://image.tmdb.org/t/p/w300/7IiT38982OfR932R3A8498i9O.jpg", src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
            { title: "The Host", img: "https://image.tmdb.org/t/p/w300/293I2L2I6O39A1uO7q3A5aI6n8A.jpg", src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" }
        ];

        const dramaslist = [
            { title: "Squid Game", img: "https://image.tmdb.org/t/p/w300/dA323282i9O83A1uO7q3A5aI6n8A.jpg", src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
            { title: "All of Us Are Dead", img: "https://image.tmdb.org/t/p/w300/pI83982O9283A1uO7q3A5aI6n8A.jpg", src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" }
        ];

        function renderRow(items, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playVideo(item.title, item.src);
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.title}">
                    <div class="card-title">${item.title}</div>
                `;
                container.appendChild(card);
            });
        }

        function playVideo(title, src) {
            document.getElementById('playing-title').innerText = title;
            const player = document.getElementById('native-player');
            player.src = src;
            document.getElementById('player-modal').style.display = 'flex';
            player.play();
        }

        function closePlayer() {
            const player = document.getElementById('native-player');
            player.pause();
            player.src = '';
            document.getElementById('player-modal').style.display = 'none';
        }

        window.onload = () => {
            renderRow(animelist, 'anime-row');
            renderRow(movieslist, 'movies-row');
            renderRow(dramaslist, 'dramas-row');
        };
    </script>
</body>
</html>
