<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JORVIE MOVIE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { 
            background: #0f0f12; 
            color: #ffffff; 
            padding-bottom: 60px; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Glassmorphism Top Bar */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(18, 18, 24, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .nav-left { display: flex; align-items: center; gap: 8px; }
        .nav-logo-img { width: 26px; height: 26px; object-fit: contain; }
        .logo { font-size: 18px; font-weight: 900; color: #ff2a39; letter-spacing: 0.8px; text-shadow: 0 0 12px rgba(255, 42, 57, 0.4); }
        .search-box input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            outline: none;
            width: 135px;
            backdrop-filter: blur(8px);
        }

        /* Hero Header Style MovieBox */
        .hero {
            position: relative;
            height: 320px;
            background: linear-gradient(180deg, rgba(15,15,18,0.2) 0%, rgba(15,15,18,0.85) 70%, #0f0f12 100%), url('https://image.tmdb.org/t/p/w780/j3O335jE8P8z23d3873462.jpg'), url('https://m.media-amazon.com/images/M/MV5BYzA2Nzk5M2EtNWY4Ny00ZjhhLWJkYTgtOWJkYDA2ZDlhZmE3XkEyXkFqcGc@._V1_.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px 16px;
        }
        .hero-badge { 
            background: linear-gradient(135deg, #ff2a39, #ff5252); 
            color: #fff; 
            font-size: 10px; 
            font-weight: 800; 
            padding: 4px 10px; 
            border-radius: 6px; 
            width: fit-content; 
            margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(255, 42, 57, 0.4);
        }
        .hero h2 { font-size: 26px; font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .hero p { font-size: 12px; color: #bbb; margin: 4px 0 16px; max-width: 90%; }
        .btn-play {
            background: linear-gradient(135deg, #e50914, #ff2a39);
            color: white;
            border: none;
            padding: 11px 24px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.5);
            width: fit-content;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }
        .btn-play:active { transform: scale(0.95); }

        /* Sections & Row Horizon */
        .section { margin-top: 24px; padding: 0 16px; }
        .section-title { font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; width: 4px; height: 16px; background: #ff2a39; border-radius: 2px; box-shadow: 0 0 8px #ff2a39; }
        
        .row {
            display: flex;
            overflow-x: auto;
            gap: 14px;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .row::-webkit-scrollbar { display: none; }

        /* Card Transparente Style MovieBox */
        .card {
            min-width: 125px;
            width: 125px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:active { transform: scale(0.95); border-color: rgba(255, 42, 57, 0.5); }
        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 175px;
            background: #1a1a22;
        }
        .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }
        .card-tag { 
            position: absolute; 
            top: 6px; 
            right: 6px; 
            background: rgba(0, 0, 0, 0.65); 
            color: #fff; 
            font-size: 9px; 
            font-weight: 800; 
            padding: 3px 6px; 
            border-radius: 5px; 
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .card-info { padding: 8px 8px 10px; }
        .card-title { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .card-sub { font-size: 10px; color: #888; margin-top: 2px; }

        /* Player Popup Local */
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            flex-direction: column;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: rgba(20, 20, 26, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .player-title { font-size: 14px; font-weight: 800; color: #fff; }
        .close-btn {
            background: #ff2a39;
            color: #fff;
            border: none;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(255, 42, 57, 0.4);
        }
        .video-container {
            width: 100%;
            height: calc(100% - 55px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video { width: 100%; max-height: 100%; outline: none; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <img src="logo.svg" alt="Logo" class="nav-logo-img" onerror="this.style.display='none'">
            <div class="logo">JORVIE MOVIE</div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Rechercher VF..." onkeyup="filterCatalog()">
        </div>
    </nav>

    <div class="hero">
        <span class="hero-badge">🔥 TENDANCE VF</span>
        <h2>Solo Leveling</h2>
        <p>Série d'action et fantasy coréenne (VF Intégrale).</p>
        <button class="btn-play" onclick="playVideo('Solo Leveling (VF)', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">
            ▶ REGARDER EN LOCAL
        </button>
    </div>

    <!-- Lecteur Vidéo Modal In-App -->
    <div id="player-modal">
        <div class="player-header">
            <span class="player-title" id="playing-title">Lecture vidéo</span>
            <button class="close-btn" onclick="closePlayer()">✕ Fermer</button>
        </div>
        <div class="video-container">
            <video id="local-video-player" controls controlsList="nodownload" playsinline autoplay>
                <source id="video-source" src="" type="video/mp4">
            </video>
        </div>
    </div>

    <!-- Sections -->
    <div class="section">
        <div class="section-title">🔥 Animés Populaires (VF)</div>
        <div class="row" id="anime-row"></div>
    </div>

    <div class="section">
        <div class="section-title">🇰🇷 Films Coréens (VF)</div>
        <div class="row" id="movies-row"></div>
    </div>

    <div class="section">
        <div class="section-title">📺 Dramas Coréens (VF)</div>
        <div class="row" id="dramas-row"></div>
    </div>

    <script>
        // Catalogues avec URLs d'images fiables (CDN Wikimedia/IMDb/TMDB fonctionnels)
        const animeData = [
            { title: 'Solo Leveling', sub: 'Épisode 1 • VF', tag: 'VF', img: 'https://m.media-amazon.com/images/M/MV5BYzA2Nzk5M2EtNWY4Ny00ZjhhLWJkYTgtOWJkYDA2ZDlhZmE3XkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4' },
            { title: 'Demon Slayer', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://m.media-amazon.com/images/M/MV5BZjgwNzE2NWItMGU1MC00MGE5LWEwMzgtM2QxMzJhNzdhMDU4XkEyXkFqcGc@._V1_.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' },
            { title: 'Arcane', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://m.media-amazon.com/images/M/MV5BYmU5OWM5ZTAtNjUzOC00NmE5LWEyM2MtM2ExNWY4M2Y3NUBhXkEyXkFqcGc@._V1_.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' },
            { title: 'One Piece', sub: 'Arc Wano • VF', tag: 'VF', img: 'https://m.media-amazon.com/images/M/MV5BMTNjNGU4NTUtYmVjMy00M2I4LWJiMjQtNTM2Y2JhMDMyNWNhXkEyXkFqcGc@._V1_.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4' }
        ];

        const movieData = [
            { title: 'Dernier Train pour Busan', sub: 'Film • VF', tag: 'VF HD', img: 'https://m.media-amazon.com/images/M/MV5BMTkwOTQ4OTg0OV5BMl5BanBnXkFtZTgwMzQyOTM0OTE@._V1_.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' },
            { title: 'Parasite', sub: 'Film • VF', tag: 'VF HD', img: 'https://m.media-amazon.com/images/M/MV5BYWZjMjk3ZTItODQ2ZC00NTY5LWE0ZDYtZTI3MjcwN2Q5NTVkXkEyXkFqcGc@._V1_.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4' },
            { title: 'The Host', sub: 'Film • VF', tag: 'VF', img: 'https://m.media-amazon.com/images/M/MV5BMjA3NTEwOTMxMV5BMl5BanBnXkFtZTcwMjMyODgzMQ@@._V1_.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4' }
        ];

        const dramaData = [
            { title: 'Squid Game', sub: 'Saison 1 • VF', tag: 'VF 4K', img: 'https://m.media-amazon.com/images/M/MV5BYWE3MDVkN2EtNjQ5MS00ZDQ4LTliNzYtMjc2YWMzMDg1ODE3XkEyXkFqcGc@._V1_.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoynies.mp4' },
            { title: 'All of Us Are Dead', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://m.media-amazon.com/images/M/MV5BZDVjMGFiN2MtNWNmZC00M2I2LWIwMDQtNWY2YzM3ZWEwM2RkXkEyXkFqcGc@._V1_.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4' },
            { title: 'Goblin', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://m.media-amazon.com/images/M/MV5BOGUxNWFiNWItN2ZhOC00MTNhLWE2MWEtYTViY2M4ZmFjYzA4XkEyXkFqcGc@._V1_.jpg', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' }
        ];

        function renderRow(list, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playVideo(item.title, item.video);
                
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <span class="card-tag">${item.tag}</span>
                        <img src="${item.img}" alt="${item.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/125x175/1a1a22/ffffff?text=${encodeURIComponent(item.title)}'">
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-sub">${item.sub}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function playVideo(title, videoUrl) {
            document.getElementById('playing-title').innerText = title;
            const player = document.getElementById('local-video-player');
            const source = document.getElementById('video-source');
            source.src = videoUrl;
            player.load();
            player.play();
            document.getElementById('player-modal').style.display = 'flex';
        }

        function closePlayer() {
            const player = document.getElementById('local-video-player');
            player.pause();
            document.getElementById('player-modal').style.display = 'none';
        }

        function filterCatalog() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filter = list => list.filter(item => item.title.toLowerCase().includes(query));
            renderRow(filter(animeData), 'anime-row');
            renderRow(filter(movieData), 'movies-row');
            renderRow(filter(dramaData), 'dramas-row');
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        window.onload = () => {
            renderRow(animeData, 'anime-row');
            renderRow(movieData, 'movies-row');
            renderRow(dramaData, 'dramas-row');
        };
    </script>
</body>
</html>
