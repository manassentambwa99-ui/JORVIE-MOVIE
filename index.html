<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JORVIE - Streaming FR</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff4081">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: #0b0c10; 
            color: #ffffff; 
            margin: 0; 
            padding: 15px; 
        }
        header { 
            text-align: center; 
            padding: 15px 0; 
            border-bottom: 1px solid #1f2833;
        }
        h1 { 
            color: #ff4081; 
            font-size: 32px; 
            letter-spacing: 2px; 
            margin: 0; 
            font-weight: 800;
        }
        p.subtitle { color: #c5c6c7; font-size: 13px; margin-top: 4px; }
        
        .category { margin-top: 25px; }
        .category h2 { 
            font-size: 17px; 
            border-left: 4px solid #ff4081; 
            padding-left: 10px; 
            color: #66fcf1;
            margin-bottom: 12px;
        }
        
        .grid { 
            display: flex; 
            overflow-x: auto; 
            gap: 12px; 
            padding-bottom: 10px;
            min-height: 200px;
        }
        .card { 
            min-width: 125px; 
            width: 125px; 
            background: #1f2833; 
            border-radius: 8px; 
            overflow: hidden; 
            cursor: pointer;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .card:active { transform: scale(0.95); }
        .card img { width: 100%; height: 175px; object-fit: cover; }
        .card p { 
            font-size: 11px; 
            text-align: center; 
            padding: 6px 4px; 
            margin: 0; 
            color: #fff;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.2;
        }

        /* Lecteur Vidéo Popup */
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #player-modal iframe {
            width: 100%;
            height: 70vh;
            border: none;
        }
        .close-btn {
            background: #ff4081;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>JORVIE</h1>
        <p class="subtitle">Espace Streaming Privé pour Jorvie ❤️</p>
    </header>

    <!-- Lecteur Vidéo Popup -->
    <div id="player-modal">
        <iframe id="video-frame" src="" allowfullscreen></iframe>
        <button class="close-btn" onclick="closePlayer()">✖ Fermer le lecteur</button>
    </div>

    <!-- Catégories -->
    <div class="category">
        <h2>💖 Animés Populaires</h2>
        <div class="grid" id="anime-list">Chargement des animés...</div>
    </div>

    <div class="category">
        <h2>🇰🇷 Films Coréens (VF)</h2>
        <div class="grid" id="korean-movies">Chargement des films...</div>
    </div>

    <div class="category">
        <h2>📺 Dramas Coréens (VF)</h2>
        <div class="grid" id="korean-dramas">Chargement des séries...</div>
    </div>

    <script>
        const TMDB_API_KEY = '826b0a5b2d96ab0bc15303a5e1d0757c';

        // 1. Charger les Animés via Jikan API (MyAnimeList) - Ultra stable et gratuit
        function loadAnime() {
            fetch('https://api.jikan.moe/v4/top/anime?limit=15')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('anime-list');
                    container.innerHTML = '';
                    data.data.forEach(item => {
                        const title = item.title_japanese || item.title;
                        const displayTitle = item.title;
                        const poster = item.images.jpg.image_url;
                        
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => openAnimePlayer(displayTitle);
                        card.innerHTML = `<img src="${poster}" alt="${displayTitle}"><p>${displayTitle}</p>`;
                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    document.getElementById('anime-list').innerHTML = '<p style="color:#aaa; padding:10px;">Erreur de chargement des animés. Réessayez.</p>';
                });
        }

        // 2. Charger les Films Coréens (TMDB)
        function loadKoreanMovies() {
            fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&with_original_language=ko&language=fr-FR&sort_by=popularity.desc`)
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('korean-movies');
                    container.innerHTML = '';
                    data.results.forEach(item => {
                        const title = item.title;
                        const id = item.id;
                        const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : '';
                        
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => openMoviePlayer('movie', id);
                        card.innerHTML = `<img src="${poster}" alt="${title}"><p>${title}</p>`;
                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    document.getElementById('korean-movies').innerHTML = '<p style="color:#aaa; padding:10px;">Erreur de chargement des films.</p>';
                });
        }

        // 3. Charger les Dramas Coréens (TMDB)
        function loadKoreanDramas() {
            fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_API_KEY}&with_original_language=ko&language=fr-FR&sort_by=popularity.desc`)
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('korean-dramas');
                    container.innerHTML = '';
                    data.results.forEach(item => {
                        const title = item.name;
                        const id = item.id;
                        const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : '';
                        
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => openMoviePlayer('tv', id);
                        card.innerHTML = `<img src="${poster}" alt="${title}"><p>${title}</p>`;
                        container.appendChild(card);
                    });
                })
                .catch(err => {
                    document.getElementById('korean-dramas').innerHTML = '<p style="color:#aaa; padding:10px;">Erreur de chargement des dramas.</p>';
                });
        }

        // Ouverture du lecteur pour les Films/Dramas
        function openMoviePlayer(type, id) {
            const player = document.getElementById('player-modal');
            const iframe = document.getElementById('video-frame');
            iframe.src = `https://vidsrc.to/embed/${type}/${id}`;
            player.style.display = 'flex';
        }

        // Ouverture du lecteur spécifique aux Animés
        function openAnimePlayer(title) {
            const player = document.getElementById('player-modal');
            const iframe = document.getElementById('video-frame');
            const formattedTitle = encodeURIComponent(title);
            iframe.src = `https://2embed.org/embed/anime?title=${formattedTitle}`;
            player.style.display = 'flex';
        }

        function closePlayer() {
            const player = document.getElementById('player-modal');
            const iframe = document.getElementById('video-frame');
            iframe.src = '';
            player.style.display = 'none';
        }

        // Enregistrement du Service Worker PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        // Lancement au chargement de la page
        window.onload = () => {
            loadAnime();
            loadKoreanMovies();
            loadKoreanDramas();
        };
    </script>

</body>
</html>
