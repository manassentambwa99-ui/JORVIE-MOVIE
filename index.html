<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JORVIE MOVIE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e50914">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #141414; color: #fff; padding-bottom: 40px; user-select: none; }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(0,0,0,0.95);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 20px; font-weight: 900; color: #e50914; letter-spacing: 1px; }
        .search-box input {
            background: #262626;
            border: 1px solid #333;
            color: #fff;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            outline: none;
            width: 130px;
        }

        .hero {
            height: 260px;
            background: linear-gradient(0deg, #141414 0%, rgba(0,0,0,0.4) 100%), url('https://image.tmdb.org/t/p/w780/m990d0M58R7E4mKkS2G0u01l3b1.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
        }
        .hero h2 { font-size: 22px; font-weight: 800; }
        .hero p { font-size: 12px; color: #ccc; margin: 4px 0 10px; }
        .hero .btn-play {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 8px 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: fit-content;
        }

        .section { margin-top: 20px; padding: 0 12px; }
        .section-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; border-left: 3px solid #e50914; padding-left: 8px; }
        
        .row {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 8px;
            scrollbar-width: none;
        }
        .row::-webkit-scrollbar { display: none; }

        .card {
            min-width: 110px;
            width: 110px;
            background: #1f1f1f;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
        }
        .card img { width: 100%; height: 155px; object-fit: cover; display: block; background: #2a2a2a; }
        .card-title { font-size: 11px; padding: 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ddd; }

        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #111;
        }
        .player-title { font-size: 13px; font-weight: bold; color: #fff; }
        .close-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 5px 12px;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .iframe-container { width: 100%; height: calc(100% - 45px); flex-grow: 1; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">JORVIE MOVIE</div>
        <div class="search-box">
            <input type="text" placeholder="Rechercher (VF)..." onkeypress="handleSearch(event)">
        </div>
    </nav>

    <div class="hero">
        <h2>Solo Leveling (VF)</h2>
        <p>Série d'action et de fantasy coréenne.</p>
        <button class="btn-play" onclick="playMedia('tv', '213713', 'Solo Leveling (VF)')">▶ REGARDER</button>
    </div>

    <!-- Modale de Lecture -->
    <div id="player-modal">
        <div class="player-header">
            <span class="player-title" id="playing-title">Lecture</span>
            <button class="close-btn" onclick="closePlayer()">✕ Fermer</button>
        </div>
        <div class="iframe-container">
            <iframe id="video-iframe" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Contenus Séparés -->
    <div class="section">
        <div class="section-title">🔥 Animés Populaires (VF)</div>
        <div class="row" id="anime-row"></div>
    </div>

    <div class="section">
        <div class="section-title">🇰🇷 Films Coréens (VF)</div>
        <div class="row" id="movies-row"></div>
    </div>

    <div class="section">
        <div class="section-title">📺 Dramas Coréens (VF)</div>
        <div class="row" id="dramas-row"></div>
    </div>

    <script>
        // Catalogues propres et distincts avec images stables (CDN direct)
        const animeData = [
            { id: '213713', title: 'Solo Leveling', img: 'https://images.justwatch.com/poster/310938637/s166/solo-leveling.webp', type: 'tv' },
            { id: '94605', title: 'Arcane', img: 'https://images.justwatch.com/poster/258284564/s166/arcane.webp', type: 'tv' },
            { id: '85937', title: 'Demon Slayer', img: 'https://images.justwatch.com/poster/151280385/s166/demon-slayer.webp', type: 'tv' },
            { id: '37854', title: 'One Piece', img: 'https://images.justwatch.com/poster/128610787/s166/one-piece.webp', type: 'tv' }
        ];

        const movieData = [
            { id: '296096', title: 'Dernier Train pour Busan', img: 'https://images.justwatch.com/poster/240890691/s166/dernier-train-pour-busan.webp', type: 'movie' },
            { id: '496243', title: 'Parasite', img: 'https://images.justwatch.com/poster/155609424/s166/parasite.webp', type: 'movie' },
            { id: '1259', title: 'The Host', img: 'https://images.justwatch.com/poster/11101962/s166/the-host.webp', type: 'movie' }
        ];

        const dramaData = [
            { id: '93405', title: 'Squid Game', img: 'https://images.justwatch.com/poster/251390487/s166/squid-game.webp', type: 'tv' },
            { id: '118320', title: 'All of Us Are Dead', img: 'https://images.justwatch.com/poster/260787498/s166/all-of-us-are-dead.webp', type: 'tv' },
            { id: '67075', title: 'Goblin', img: 'https://images.justwatch.com/poster/17540203/s166/goblin.webp', type: 'tv' }
        ];

        function renderCategory(list, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playMedia(item.type, item.id, item.title);
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.title}">
                    <div class="card-title">${item.title}</div>
                `;
                container.appendChild(card);
            });
        }

        function playMedia(type, id, title) {
            document.getElementById('playing-title').innerText = title;
            const iframe = document.getElementById('video-iframe');
            iframe.src = `https://vidsrc.me/embed/${type}?tmdb=${id}&lang=fr`;
            document.getElementById('player-modal').style.display = 'flex';
        }

        function closePlayer() {
            const iframe = document.getElementById('video-iframe');
            iframe.src = '';
            document.getElementById('player-modal').style.display = 'none';
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        window.onload = () => {
            renderCategory(animeData, 'anime-row');
            renderCategory(movieData, 'movies-row');
            renderCategory(dramaData, 'dramas-row');
        };
    </script>
</body>
</html>
