<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JORVIE MOVIE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0d11">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { 
            background: #0d0d11; 
            color: #ffffff; 
            padding-bottom: 60px; 
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Navigation Style Glassmorphism */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(18, 18, 24, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .logo { font-size: 18px; font-weight: 900; color: #ff2a39; letter-spacing: 0.8px; text-shadow: 0 0 12px rgba(255, 42, 57, 0.4); }
        .search-box input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            outline: none;
            width: 130px;
        }

        /* Hero Banner */
        .hero {
            position: relative;
            height: 300px;
            background: linear-gradient(180deg, rgba(13,13,17,0.2) 0%, rgba(13,13,17,0.9) 80%, #0d0d11 100%), url('https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Film_banner_placeholder.jpg/800px-Film_banner_placeholder.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px 16px;
        }
        .hero-badge { 
            background: linear-gradient(135deg, #ff2a39, #ff5252); 
            color: #fff; 
            font-size: 10px; 
            font-weight: 800; 
            padding: 4px 10px; 
            border-radius: 6px; 
            width: fit-content; 
            margin-bottom: 8px;
            box-shadow: 0 2px 8px rgba(255, 42, 57, 0.4);
        }
        .hero h2 { font-size: 26px; font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .hero p { font-size: 12px; color: #bbb; margin: 4px 0 16px; }
        .btn-play {
            background: linear-gradient(135deg, #e50914, #ff2a39);
            color: white;
            border: none;
            padding: 11px 24px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.5);
            width: fit-content;
        }

        /* Carrousel */
        .section { margin-top: 24px; padding: 0 16px; }
        .section-title { font-size: 16px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; width: 4px; height: 16px; background: #ff2a39; border-radius: 2px; box-shadow: 0 0 8px #ff2a39; }
        
        .row {
            display: flex;
            overflow-x: auto;
            gap: 14px;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .row::-webkit-scrollbar { display: none; }

        /* Cartes d'images translucides Style MovieBox */
        .card {
            min-width: 125px;
            width: 125px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.95); }
        .card-img-wrapper {
            width: 100%;
            height: 175px;
            background: #181822;
            position: relative;
        }
        .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
        }
        .card-tag { 
            position: absolute; top: 6px; right: 6px; 
            background: rgba(0, 0, 0, 0.75); color: #fff; 
            font-size: 9px; font-weight: 800; padding: 3px 6px; 
            border-radius: 5px; backdrop-filter: blur(6px);
        }
        .card-info { padding: 8px 8px 10px; }
        .card-title { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .card-sub { font-size: 10px; color: #888; margin-top: 2px; }

        /* Lecteur Vidéo Local / Pop-up */
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(20px);
            z-index: 1000;
            flex-direction: column;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: rgba(20, 20, 26, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .player-title { font-size: 14px; font-weight: 800; color: #fff; }
        .close-btn {
            background: #ff2a39; color: #fff; border: none; 
            padding: 7px 16px; border-radius: 20px; 
            font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .video-container {
            width: 100%; height: calc(100% - 55px);
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        video { width: 100%; max-height: 100%; outline: none; }

        /* Module de Publicité 5s */
        #ad-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0d0d11;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .ad-timer {
            position: absolute; top: 20px; right: 20px;
            background: #ff2a39; color: #fff; padding: 6px 14px;
            border-radius: 16px; font-size: 12px; font-weight: bold;
        }
        .ad-box { text-align: center; padding: 20px; }
        .ad-box h3 { color: #ff2a39; font-size: 20px; margin-bottom: 8px; }
        .ad-box p { color: #aaa; font-size: 13px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">JORVIE MOVIE</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Recherche VF..." onkeyup="filterCatalog()">
        </div>
    </nav>

    <div class="hero" id="hero-banner">
        <span class="hero-badge">🔥 TENDANCE VF</span>
        <h2>Solo Leveling</h2>
        <p>Série d'action et fantasy coréenne (VF Intégrale).</p>
        <button class="btn-play" onclick="playMedia('Solo Leveling (VF)', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">
            ▶ REGARDER
        </button>
    </div>

    <!-- Reader Modal avec Pub -->
    <div id="player-modal">
        <div class="player-header">
            <span class="player-title" id="playing-title">Lecture vidéo</span>
            <button class="close-btn" onclick="closePlayer()">✕ Fermer</button>
        </div>
        <div class="video-container">
            <div id="ad-overlay">
                <div class="ad-timer" id="ad-timer">Publicité : 5s</div>
                <div class="ad-box">
                    <h3>JORVIE MOVIE</h3>
                    <p>Chargement du film en cours...</p>
                </div>
            </div>
            <video id="local-player" controls controlsList="nodownload" playsinline autoplay>
                <source id="video-source" src="" type="video/mp4">
            </video>
        </div>
    </div>

    <!-- Catalogues -->
    <div class="section">
        <div class="section-title">🔥 Animés Populaires (VF)</div>
        <div class="row" id="anime-row"></div>
    </div>

    <div class="section">
        <div class="section-title">🇰🇷 Films Coréens (VF)</div>
        <div class="row" id="movies-row"></div>
    </div>

    <div class="section">
        <div class="section-title">📺 Dramas Coréens (VF)</div>
        <div class="row" id="dramas-row"></div>
    </div>

    <script>
        // Images garanties 100% visibles sans blocage de serveur
        const animeData = [
            { title: 'Solo Leveling', sub: 'Épisode 1 • VF', tag: 'VF', img: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=400&q=80', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4' },
            { title: 'Demon Slayer', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=400&q=80', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' },
            { title: 'Arcane', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://images.unsplash.com/photo-1563089145-599997674d42?w=400&q=80', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' },
            { title: 'One Piece', sub: 'Arc Wano • VF', tag: 'VF', img: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400&q=80', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4' }
        ];

        const movieData = [
            { title: 'Dernier Train pour Busan', sub: 'Film • VF', tag: 'VF HD', img: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=400&q=80', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' },
            { title: 'Parasite', sub: 'Film • VF', tag: 'VF HD', img: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&q=80', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4' },
            { title: 'The Host', sub: 'Film • VF', tag: 'VF', img: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=400&q=80', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4' }
        ];

        const dramaData = [
            { title: 'Squid Game', sub: 'Saison 1 • VF', tag: 'VF 4K', img: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400&q=80', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoynies.mp4' },
            { title: 'All of Us Are Dead', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=400&q=80', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4' },
            { title: 'Goblin', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&q=80', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' }
        ];

        // Création dynamique d'affiche élégante si l'image ne charge pas
        function getSVGPlaceholder(title) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="125" height="175" viewBox="0 0 125 175"><rect width="100%" height="100%" fill="#1a1a24"/><text x="50%" y="45%" fill="#ff2a39" font-family="sans-serif" font-weight="900" font-size="28" text-anchor="middle">🎬</text><text x="50%" y="70%" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">${title}</text></svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        function renderRow(list, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playMedia(item.title, item.video);
                
                const fallbackImg = getSVGPlaceholder(item.title);

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <span class="card-tag">${item.tag}</span>
                        <img src="${item.img}" alt="${item.title}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImg}';">
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-sub">${item.sub}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        let adTimerInterval;

        function playMedia(title, videoUrl) {
            document.getElementById('playing-title').innerText = title;
            const player = document.getElementById('local-player');
            const source = document.getElementById('video-source');
            const adOverlay = document.getElementById('ad-overlay');
            const adTimer = document.getElementById('ad-timer');

            source.src = videoUrl;
            player.load();

            adOverlay.style.display = 'flex';
            document.getElementById('player-modal').style.display = 'flex';

            let count = 5;
            adTimer.innerText = `Publicité : ${count}s`;

            clearInterval(adTimerInterval);
            adTimerInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    adTimer.innerText = `Publicité : ${count}s`;
                } else {
                    clearInterval(adTimerInterval);
                    adOverlay.style.display = 'none';
                    player.play();
                }
            }, 1000);
        }

        function closePlayer() {
            const player = document.getElementById('local-player');
            player.pause();
            clearInterval(adTimerInterval);
            document.getElementById('player-modal').style.display = 'none';
        }

        function filterCatalog() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filter = list => list.filter(item => item.title.toLowerCase().includes(query));
            renderRow(filter(animeData), 'anime-row');
            renderRow(filter(movieData), 'movies-row');
            renderRow(filter(dramaData), 'dramas-row');
        }

        window.onload = () => {
            renderRow(animeData, 'anime-row');
            renderRow(movieData, 'movies-row');
            renderRow(dramaData, 'dramas-row');
        };
    </script>
</body>
</html>
