<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JORVIE MOVIE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e50914">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding-bottom: 50px; user-select: none; }

        /* Navigation */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #222;
        }
        .nav-left { display: flex; align-items: center; gap: 8px; }
        .nav-logo-img { width: 26px; height: 26px; object-fit: contain; }
        .logo { font-size: 19px; font-weight: 900; color: #e50914; letter-spacing: 0.5px; }
        .search-box input {
            background: #252525;
            border: 1px solid #333;
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            outline: none;
            width: 140px;
        }

        /* Banner Style MovieBox */
        .hero {
            position: relative;
            height: 300px;
            background: linear-gradient(180deg, rgba(18,18,18,0.1) 0%, rgba(18,18,18,1) 100%), url('https://images.justwatch.com/backdrop/310938637/s1440/solo-leveling.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }
        .hero-badge { background: #e50914; color: #fff; font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 4px; width: fit-content; margin-bottom: 6px; }
        .hero h2 { font-size: 26px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
        .hero p { font-size: 12px; color: #aaa; margin: 4px 0 14px; max-width: 90%; }
        .btn-play {
            background: #e50914;
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
            width: fit-content;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Sections & Grille MovieBox */
        .section { margin-top: 24px; padding: 0 16px; }
        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; width: 4px; height: 16px; background: #e50914; border-radius: 2px; }
        
        .row {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .row::-webkit-scrollbar { display: none; }

        .card {
            min-width: 120px;
            width: 120px;
            background: #1c1c1c;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s ease;
        }
        .card:active { transform: scale(0.96); }
        .card img { width: 100%; height: 170px; object-fit: cover; display: block; background: #2a2a2a; }
        .card-tag { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.7); color: #fff; font-size: 9px; font-weight: bold; padding: 2px 5px; border-radius: 3px; backdrop-filter: blur(4px); }
        .card-info { padding: 8px 6px; }
        .card-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .card-sub { font-size: 10px; color: #888; margin-top: 2px; }

        /* Lecteur Vidéo Local / Popup */
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            flex-direction: column;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #181818;
            border-bottom: 1px solid #282828;
        }
        .player-title { font-size: 14px; font-weight: bold; color: #fff; }
        .close-btn {
            background: #282828;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .video-container {
            width: 100%;
            height: calc(100% - 50px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        video { width: 100%; max-height: 100%; outline: none; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <img src="logo.svg" alt="Logo" class="nav-logo-img" onerror="this.style.display='none'">
            <div class="logo">JORVIE MOVIE</div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Recherche (VF)..." onkeyup="filterCatalog()">
        </div>
    </nav>

    <div class="hero">
        <span class="hero-badge">VF • TENDANCE</span>
        <h2>Solo Leveling</h2>
        <p>Série d'action et de fantasy épique (Saison 1 complète en Français).</p>
        <button class="btn-play" onclick="playVideo('Solo Leveling (VF)', 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4')">
            ▶ REGARDER MAINTENANT
        </button>
    </div>

    <!-- Lecteur Vidéo Direct Local -->
    <div id="player-modal">
        <div class="player-header">
            <span class="player-title" id="playing-title">Lecture vidéo</span>
            <button class="close-btn" onclick="closePlayer()">✕ Fermer</button>
        </div>
        <div class="video-container">
            <video id="local-video-player" controls controlsList="nodownload" playsinline autoplay>
                <source id="video-source" src="" type="video/mp4">
                Votre navigateur ne supporte pas la lecture de cette vidéo.
            </video>
        </div>
    </div>

    <!-- Catégories de contenus VF -->
    <div class="section">
        <div class="section-title">🔥 Animés (VF)</div>
        <div class="row" id="anime-row"></div>
    </div>

    <div class="section">
        <div class="section-title">🇰🇷 Films Coréens (VF)</div>
        <div class="row" id="movies-row"></div>
    </div>

    <div class="section">
        <div class="section-title">📺 Dramas Coréens (VF)</div>
        <div class="row" id="dramas-row"></div>
    </div>

    <script>
        // Catalogue avec images fiables et vidéos MP4 directes en Français / VF
        const animeData = [
            { title: 'Solo Leveling', sub: 'Épisode 1 • VF', tag: 'VF', img: 'https://images.justwatch.com/poster/310938637/s166/solo-leveling.webp', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4' },
            { title: 'Demon Slayer', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://images.justwatch.com/poster/151280385/s166/demon-slayer.webp', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' },
            { title: 'Arcane', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://images.justwatch.com/poster/258284564/s166/arcane.webp', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' },
            { title: 'One Piece', sub: 'Arc Wano • VF', tag: 'VF', img: 'https://images.justwatch.com/poster/128610787/s166/one-piece.webp', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4' }
        ];

        const movieData = [
            { title: 'Dernier Train pour Busan', sub: 'Film Complet • VF', tag: 'VF HD', img: 'https://images.justwatch.com/poster/240890691/s166/dernier-train-pour-busan.webp', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4' },
            { title: 'Parasite', sub: 'Film Complet • VF', tag: 'VF HD', img: 'https://images.justwatch.com/poster/155609424/s166/parasite.webp', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4' },
            { title: 'The Host', sub: 'Film Complet • VF', tag: 'VF', img: 'https://images.justwatch.com/poster/11101962/s166/the-host.webp', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4' }
        ];

        const dramaData = [
            { title: 'Squid Game', sub: 'Épisode 1 • VF', tag: 'VF 4K', img: 'https://images.justwatch.com/poster/251390487/s166/squid-game.webp', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoynies.mp4' },
            { title: 'All of Us Are Dead', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://images.justwatch.com/poster/260787498/s166/all-of-us-are-dead.webp', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4' },
            { title: 'Goblin', sub: 'Saison 1 • VF', tag: 'VF', img: 'https://images.justwatch.com/poster/17540203/s166/goblin.webp', video: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4' }
        ];

        function renderRow(list, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playVideo(item.title, item.video);
                card.innerHTML = `
                    <span class="card-tag">${item.tag}</span>
                    <img src="${item.img}" alt="${item.title}" loading="lazy">
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-sub">${item.sub}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function playVideo(title, videoUrl) {
            document.getElementById('playing-title').innerText = title;
            const player = document.getElementById('local-video-player');
            const source = document.getElementById('video-source');
            source.src = videoUrl;
            player.load();
            player.play();
            document.getElementById('player-modal').style.display = 'flex';
        }

        function closePlayer() {
            const player = document.getElementById('local-video-player');
            player.pause();
            document.getElementById('player-modal').style.display = 'none';
        }

        function filterCatalog() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filter = list => list.filter(item => item.title.toLowerCase().includes(query));
            renderRow(filter(animeData), 'anime-row');
            renderRow(filter(movieData), 'movies-row');
            renderRow(filter(dramaData), 'dramas-row');
        }

        // Enregistrement PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        window.onload = () => {
            renderRow(animeData, 'anime-row');
            renderRow(movieData, 'movies-row');
            renderRow(dramaData, 'dramas-row');
        };
    </script>
</body>
</html>
