<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2833" />
      <stop offset="100%" stop-color="#0b0c10" />
    </linearGradient>

    <!-- Accent Pink/Purple Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />
  <rect x="10" y="10" width="492" height="492" rx="100" fill="none" stroke="url(#accentGrad)" stroke-width="8" opacity="0.4" />

  <!-- Stylized Letter 'J' -->
  <path d="M 280 140 
           L 280 300 
           C 280 360, 230 400, 170 400 
           C 130 400, 100 380, 85 350 
           A 20 20 0 0 1 110 325 
           C 120 345, 140 355, 170 355 
           C 205 355, 230 330, 230 295 
           L 230 140 
           Z" 
        fill="url(#accentGrad)" />

  <!-- Heart Icon Accent -->
  <path d="M 330 150 
           C 330 130, 350 115, 370 115 
           C 385 115, 395 125, 400 135 
           C 405 125, 415 115, 430 115 
           C 450 115, 470 130, 470 150 
           C 470 185, 415 220, 400 230 
           C 385 220, 330 185, 330 150 Z" 
        fill="#ff4081" />
</svg>
