<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JORVIE - Animés & Dramas</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0b0c10; 
            color: #ffffff; 
            margin: 0; 
            padding: 15px; 
        }
        header { 
            text-align: center; 
            padding: 20px 0; 
            border-bottom: 1px solid #1f2833;
        }
        h1 { 
            color: #ff4081; 
            font-size: 36px; 
            letter-spacing: 3px; 
            margin: 0; 
            text-transform: uppercase;
            font-weight: 800;
        }
        p.subtitle { color: #c5c6c7; font-size: 13px; margin-top: 6px; }
        
        .category { margin-top: 30px; }
        .category h2 { 
            font-size: 18px; 
            border-left: 4px solid #ff4081; 
            padding-left: 10px; 
            color: #66fcf1;
            margin-bottom: 12px;
        }
        
        /* Grille défilante horizontalement pour mobile */
        .grid { 
            display: flex; 
            overflow-x: auto; 
            gap: 12px; 
            padding-bottom: 15px;
            scrollbar-width: thin;
        }
        .card { 
            min-width: 130px; 
            width: 130px; 
            background: #1f2833; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        .card img { 
            width: 100%; 
            height: 185px; 
            object-fit: cover; 
        }
        .card p { 
            font-size: 11px; 
            text-align: center; 
            padding: 8px 5px; 
            margin: 0; 
            font-weight: 600;
            color: #fff;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>JORVIE</h1>
        <p class="subtitle">Espace Streaming Privé pour Jorvie ❤️</p>
    </header>

    <!-- Catégorie Animés Romance -->
    <div class="category">
        <h2>💖 Animés Romance</h2>
        <div class="grid" id="romance-anime">Chargement...</div>
    </div>

    <!-- Catégorie Animés Action -->
    <div class="category">
        <h2>🔥 Animés Action</h2>
        <div class="grid" id="action-anime">Chargement...</div>
    </div>

    <!-- Catégorie Films & Dramas Coréens -->
    <div class="category">
        <h2>🇰🇷 Films & Dramas Coréens</h2>
        <div class="grid" id="korean-movies">Chargement...</div>
    </div>

    <script>
        // Clé API gratuite TMDB pour charger les films coréens réels
        const TMDB_API_KEY = '826b0a5b2d96ab0bc15303a5e1d0757c'; 

        // 1. Charger les Animés réels (via l'API Kitsu)
        function loadAnime(category, containerId) {
            fetch(`https://kitsu.io/api/edge/anime?filter[categories]=${category}&page[limit]=12`)
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById(containerId);
                    container.innerHTML = '';
                    data.data.forEach(item => {
                        const title = item.attributes.canonicalTitle;
                        const poster = item.attributes.posterImage ? item.attributes.posterImage.small : '';
                        
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <img src="${poster}" alt="${title}">
                            <p>${title}</p>
                        `;
                        container.appendChild(card);
                    });
                });
        }

        // 2. Charger les Films/Dramas Coréens réels (via TMDB API)
        function loadKoreanContent() {
            fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_API_KEY}&with_original_language=ko&sort_by=popularity.desc`)
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('korean-movies');
                    container.innerHTML = '';
                    data.results.forEach(item => {
                        const title = item.name || item.title;
                        const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : '';
                        
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <img src="${poster}" alt="${title}">
                            <p>${title}</p>
                        `;
                        container.appendChild(card);
                    });
                });
        }

        // Lancement au chargement de la page
        loadAnime('romance', 'romance-anime');
        loadAnime('action', 'action-anime');
        loadKoreanContent();
    </script>

</body>
</html>
